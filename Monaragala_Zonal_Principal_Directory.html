<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zonal Principal Data — Monaragala Zonal Education Office</title>
<style>
  :root{
    --navy:#1B3A4B; --maroon:#7A1F2B; --gold:#B8892B; --bg:#F7F4EE;
    --card:#FFFFFF; --line:#E4DFD3; --ink:#2B2B28; --muted:#767066;
    --serif: 'calibri', 'Iowan Old Style', serif; --sans: 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px;}
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{width:210px; background:var(--navy); color:#EFE8D8; flex-shrink:0; display:flex; flex-direction:column;}
  #sidebar .brand{padding:22px 18px 16px; border-bottom:1px solid rgba(255,255,255,0.12);}
  #sidebar .seal{width:40px; height:40px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:15px; color:var(--gold); margin-bottom:10px;}
  #sidebar .title{font-family:var(--serif); font-size:15.5px; line-height:1.3; font-weight:700;}
  #sidebar .subtitle{font-size:10.5px; opacity:.65; margin-top:4px; letter-spacing:.5px;}
  nav{padding:14px 10px; display:flex; flex-direction:column; gap:3px;}
  nav button{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px; border:none; cursor:pointer;
    text-align:left; font-size:13.5px; background:transparent; color:#D9D2BF; font-weight:500; border-left:3px solid transparent; font-family:var(--sans);}
  nav button.active{background:rgba(184,137,43,0.22); color:#F4E7C8; font-weight:600; border-left:3px solid var(--gold);}
  nav button svg{flex-shrink:0;}
  .foot{margin-top:auto; padding:14px 18px; font-size:10.5px; opacity:.5; border-top:1px solid rgba(255,255,255,0.1);}

  /* Main */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  header{padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; justify-content:space-between; align-items:center;}
  header .h1{font-family:var(--serif); font-size:19px; font-weight:700; color:var(--navy);}
  header .sub{font-size:12px; color:var(--muted);}
  .btn-primary{display:flex; align-items:center; gap:6px; background:var(--maroon); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
  #content{padding:24px; overflow:auto; flex:1;}

  /* Cards / stats */
  .stat-row{display:flex; gap:14px; flex-wrap:wrap;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; min-width:140px; flex:1 1 140px;}
  .stat .val{font-size:28px; font-weight:700; color:var(--navy); font-family:var(--serif);}
  .stat .lbl{font-size:12.5px; color:var(--muted); margin-top:4px; letter-spacing:.2px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:22px;}
  .panel h3{font-family:var(--serif); font-weight:700; color:var(--navy); margin:0 0 14px; font-size:15px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-row .name{width:190px; font-size:12.5px;}
  .bar-track{flex:1; height:9px; background:var(--bg); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--gold);}
  .bar-row .count{width:22px; font-size:12.5px; text-align:right; color:var(--muted);}

  /* Manage list */
  .rec-row{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px;}
  .rec-row .who{display:flex; gap:16px; align-items:center; min-width:0;}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--navy); color:#F4E7C8; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:14px; flex-shrink:0;}
  .who .name{font-weight:600; font-size:14px;}
  .who .meta{font-size:12px; color:var(--muted);}
  .icon-btn{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy); margin-left:6px;}
  .icon-btn.danger{color:var(--maroon);}

  /* Filters */
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filters label{display:flex; flex-direction:column; gap:4px; font-size:12px;}
  .filters span{color:var(--muted); font-weight:600;}
  select, input{border:1px solid var(--line); border-radius:7px; padding:9px 10px; font-size:13.5px; font-family:var(--sans); background:#fff; color:var(--ink); outline:none;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead tr{background:var(--navy); color:#F4E7C8; text-align:left;}
  th{padding:9px 12px; font-weight:600; white-space:nowrap;}
  td{padding:9px 12px; white-space:nowrap;}
  tbody tr{border-top:1px solid var(--line);}
  .table-wrap{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto;}
  .empty-note{padding:16px; font-size:12.5px; color:var(--muted);}

  .search-box{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:340px; margin-bottom:14px;}
  .search-box input{border:none; outline:none; font-size:13px; flex:1; padding:0;}

  /* Inline Add/Edit Principal form */
  #overlay{display:none; width:100%; padding:0; margin:0 0 22px; background:transparent;}
  #overlay.show{display:block;}
  #formCard{background:#fff; border:1px solid var(--line); border-top:4px solid var(--gold); box-shadow:0 8px 24px rgba(27,58,75,.08); border-radius:12px; width:100%; max-width:100%; max-height:none; overflow:visible; padding:24px;}
  .form-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .form-head .t{font-family:var(--serif); font-size:17px; font-weight:700; color:var(--navy);}
  .close-btn{background:none; border:none; cursor:pointer; color:var(--muted);}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 18px;}
  #formCard .field input, #formCard .field select{width:100%; min-width:0; padding:11px 12px; border-color:#d8d3c8; background:#fff;}
  #formCard .field input:focus, #formCard .field select:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,137,43,.13);}
  #formCard .form-actions{position:sticky; bottom:0; background:#fff; padding:16px 0 0;}
  .field{display:flex; flex-direction:column; gap:6px; font-size:13px;}
  .field span{color:var(--muted); font-weight:600;}
  .field span b{color:var(--gold); margin-right:6px;}
  .span2{grid-column:1 / -1;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--line); padding-top:14px; margin-top:16px;}
  .btn-ghost{padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px;}
  .btn-save{display:flex; align-items:center; gap:6px; padding:9px 18px; border-radius:8px; border:none; background:var(--maroon); color:#fff; cursor:pointer; font-size:13px; font-weight:600;}


  /* Zonal Education Office Logo */
  #sidebar .office-logo{
    width:78px; height:78px; object-fit:cover; display:block;
    margin:0 auto 12px; background:#fff; border-radius:50%;
    border:2px solid var(--gold); padding:2px;
  }
  #loginCard .office-logo{
    width:112px; height:112px; object-fit:cover; display:block;
    margin:0 auto 16px; background:#fff; border-radius:50%;
    border:3px solid var(--gold); padding:3px;
  }
  @media(max-width:700px){
    #sidebar .office-logo{width:64px;height:64px;}
    #loginCard .office-logo{width:96px;height:96px;}
    #content{padding:14px;}
    #formCard{padding:16px;}
    .grid2{grid-template-columns:1fr; gap:13px;}
    .span2{grid-column:auto;}
  }

  /* Admin Login */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#102936);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #loginCard{width:390px;max-width:100%;background:#fff;border-radius:14px;padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);}
  #loginCard .login-seal{width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;color:var(--gold);background:var(--navy);
    font-family:var(--serif);font-weight:700;font-size:20px;margin:0 auto 14px;}
  #loginCard h2{text-align:center;color:var(--navy);font-family:var(--serif);margin:0 0 6px;}
  #loginCard p{text-align:center;color:var(--muted);font-size:12px;margin:0 0 22px;}
  .login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .login-field label{font-size:12px;color:var(--muted);font-weight:600;}
  .login-field input{width:100%;padding:11px 12px;}
  #loginError{color:var(--maroon);font-size:12px;text-align:center;min-height:18px;margin:8px 0;}
  .login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--maroon);
    color:#fff;font-weight:600;cursor:pointer;font-size:14px;}
  .logout-btn{margin-left:10px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--maroon);cursor:pointer;font-size:12px;font-weight:600;}


  .action-btn{
    padding:9px 14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--navy);cursor:pointer;font-size:13px;font-weight:600;
    margin-right:8px;
  }
  .action-btn:hover{background:var(--bg);}

</style>
</head>

      <button type="submit" class="btn-save">💾 Save Record</button>
    </div>

<script>
// ---------- Constants ----------
const DIVISIONS = ["Monaragala","Badalkumbura","Siyabalanduwa"];
const SCHOOL_TYPES = ["1AB","1C","Type 2","Type 3"];
const APPOINTMENT_TYPES = [
  "Graded Principal","Acting Principal","Deputy Principal (Graded)",
  "Deputy Principal (Acting)","Assistant Principal (Graded)","Assistant Principal (Acting)"
];
const GRADES = ["SLPS I","SLPS II","SLPS III","SLTS I","SLTS 2-I","SLTS 2-II","SLTS 3-I"];
const QUALIFICATIONS = [
  "M.Ed (Education)","MA Degree","MSc Degree","BA Degree","BSc Degree","BCom Degree",
  "B.Ed (Education)","GCE A/L","GCE O/L"
];

const FIELD_DEFS = [
  {key:"division", num:1, label:"Education Division", type:"select", opts:DIVISIONS},
  {key:"censusNo", num:2, label:"Census No", type:"text"},
  {key:"schoolName", num:3, label:"School Name", type:"text", required:true},
  {key:"schoolAddress", num:4, label:"School Address", type:"text"},
  {key:"principalName", num:5, label:"Principal Name", type:"text", required:true},
  {key:"nic", num:6, label:"NIC No", type:"text"},
  {key:"dob", num:7, label:"Date of Birth", type:"date"},
  {key:"schoolType", num:8, label:"School Type", type:"select", opts:SCHOOL_TYPES},
  {key:"appointmentType", num:9, label:"Appointment Type", type:"select", opts:APPOINTMENT_TYPES},
  {key:"dateAppointed", num:10, label:"Date Appointed to this School", type:"date"},
  {key:"phone", num:11, label:"Telephone No (Mobile/WhatsApp)", type:"text"},
  {key:"grade", num:12, label:"Service and Grade", type:"select", opts:GRADES},
  {key:"qualification", num:13, label:"Higher Education Qualification", type:"select", opts:QUALIFICATIONS, span2:true},
];

const TABS = [
  {id:"dashboard", label:"Dashboard", icon:iconDash},
  {id:"manage", label:"Principal Data", icon:iconUsers},
  {id:"report", label:"Report", icon:iconReport},
  {id:"database", label:"Database", icon:iconDb},
];

// ---------- State ----------
let records = [
  {id:1, division:"Bibile", censusNo:"12045", schoolName:"Bibile Central College", schoolAddress:"Bibile Road, Bibile",
   principalName:"W.M. Ranasinghe", nic:"197845201234", dob:"1978-03-12", schoolType:"1AB",
   appointmentType:"Graded Principal", dateAppointed:"2019-06-01", phone:"0771234567", grade:"SLPS I", qualification:"M.Ed (Education)"},
  {id:2, division:"Medagama", censusNo:"12089", schoolName:"Medagama Maha Vidyalaya", schoolAddress:"Main Street, Medagama",
   principalName:"K.A.D. Perera", nic:"198567402345", dob:"1985-11-02", schoolType:"1C",
   appointmentType:"Acting Principal", dateAppointed:"2022-01-15", phone:"0719876543", grade:"SLPS II", qualification:"BSc Degree"},
  {id:3, division:"Madulla", censusNo:"12103", schoolName:"Madulla National School", schoolAddress:"Temple Road, Madulla",
   principalName:"S. Kumari Silva", nic:"199032603456", dob:"1990-07-22", schoolType:"Type 2",
   appointmentType:"Deputy Principal (Graded)", dateAppointed:"2021-09-10", phone:"0763456789", grade:"SLTS I", qualification:"BA Degree"},
];
let currentTab = "dashboard";
let editingId = null;
let searchQuery = "";
let filters = {division:"All", schoolType:"All", grade:"All", appointmentType:"All"};

// ---------- Icons (simple inline SVG) ----------
function iconDash(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>`;}
function iconUsers(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>`;}
function iconReport(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>`;}
function iconDb(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>`;}

// ---------- Render nav ----------
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(t=>{
    const btn = document.createElement("button");
    btn.className = t.id===currentTab ? "active" : "";
    btn.innerHTML = `${t.icon()} <span>${t.label}</span>`;
    btn.onclick = () => { currentTab = t.id; render(); };
    nav.appendChild(btn);
  });
}

// ---------- Helpers ----------
function computeStats(){
  const byDivision = {};
  DIVISIONS.forEach(d=> byDivision[d] = records.filter(r=>r.division===d).length);
  const byPosition = {};
  APPOINTMENT_TYPES.forEach(p=> byPosition[p] = records.filter(r=>r.appointmentType===p).length);
  return {total: records.length, byDivision, byPosition};
}
function filteredReport(){
  return records.filter(r=>{
    if(filters.division!=="All" && r.division!==filters.division) return false;
    if(filters.schoolType!=="All" && r.schoolType!==filters.schoolType) return false;
    if(filters.grade!=="All" && r.grade!==filters.grade) return false;
    if(filters.appointmentType!=="All" && r.appointmentType!==filters.appointmentType) return false;
    return true;
  });
}
function filteredDb(){
  const q = searchQuery.trim().toLowerCase();
  if(!q) return records;
  return records.filter(r => [r.schoolName,r.principalName,r.censusNo,r.nic,r.division].join(" ").toLowerCase().includes(q));
}

// ---------- Render content ----------
function render(){
  renderNav();
  document.getElementById("pageTitle").textContent = TABS.find(t=>t.id===currentTab).label;
  document.getElementById("addBtn").style.display = currentTab==="manage" ? "flex" : "none";
  const content = document.getElementById("content");

  if(currentTab==="dashboard") content.innerHTML = renderDashboard();
  else if(currentTab==="manage") content.innerHTML = renderManage();
  else if(currentTab==="report") content.innerHTML = renderReport();
  else if(currentTab==="database") content.innerHTML = renderDatabase();

  attachContentEvents();
}

function renderDashboard(){
  const s = computeStats();
  let html = `<div class="stat-row">
    <div class="stat"><div class="val" style="color:var(--maroon)">${s.total}</div><div class="lbl">Total Principal / Deputy / Assistant Records</div></div>`;
  DIVISIONS.forEach(d=>{
    html += `<div class="stat"><div class="val">${s.byDivision[d]}</div><div class="lbl">${d} Division</div></div>`;
  });
  html += `</div><div class="panel"><h3>By Position Type</h3>`;
  APPOINTMENT_TYPES.forEach(p=>{
    const count = s.byPosition[p];
    const pct = s.total ? (count/s.total*100) : 0;
    html += `<div class="bar-row"><div class="name">${p}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="count">${count}</div></div>`;
  });
  html += `</div>`;
  return html;
}

function renderManage(){
  if(records.length===0) return `<div class="empty-note">No records yet. Add a principal to get started.</div>`;
  return records.map(r=>`
    <div class="rec-row">
      <div class="who">
        <div class="avatar">${(r.principalName||"?")[0]}</div>
        <div>
          <div class="name">${r.principalName}</div>
          <div class="meta">${r.schoolName} · ${r.division} · ${r.appointmentType}</div>
        </div>
      </div>
      <div>
        <button class="icon-btn" data-edit="${r.id}">✎</button>
        <button class="icon-btn danger" data-del="${r.id}">🗑</button>
      </div>
    </div>
  `).join("");
}

function renderReport(){
  const rows = filteredReport();
  let html = `<div style="margin-bottom:14px;">
    <button class="action-btn" id="printReportBtn">🖨 Print Report</button>
    <button class="action-btn" id="exportReportBtn">📊 Export Report to Excel</button>
  </div>
  <div class="filters">
    ${filterSelect("division","Division",["All",...DIVISIONS])}
    ${filterSelect("schoolType","School Type",["All",...SCHOOL_TYPES])}
    ${filterSelect("grade","Grade",["All",...GRADES])}
    ${filterSelect("appointmentType","Position Type",["All",...APPOINTMENT_TYPES])}
  </div>
  <div class="table-wrap"><table><thead><tr>
    <th>School</th><th>Division</th><th>Type</th><th>Principal</th><th>Position</th><th>Grade</th>
  </tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr><td>${r.schoolName}</td><td>${r.division}</td><td>${r.schoolType}</td><td>${r.principalName}</td><td>${r.appointmentType}</td><td>${r.grade}</td></tr>`;
  });
  html += `</tbody></table>`;
  if(rows.length===0) html += `<div class="empty-note">No records match this filter.</div>`;
  html += `</div><div class="sub" style="margin-top:10px;">${rows.length} of ${records.length} records shown</div>`;
  return html;
}

function filterSelect(key,label,options){
  return `<label><span>${label}</span>
    <select data-filter="${key}">
      ${options.map(o=>`<option ${filters[key]===o?"selected":""}>${o}</option>`).join("")}
    </select>
  </label>`;
}

function renderDatabase(){
  const rows = filteredDb();
  const headers = ["Census No","School","Division","Principal","NIC","DOB","Type","Position","Appointed","Phone","Grade","Qualification"];
  let html = `<div style="margin-bottom:14px;">
    <button class="action-btn" id="exportDatabaseBtn">📊 Export All Data to Excel</button>
  </div>
  <div class="search-box">🔍 <input id="searchInput" placeholder="Search school, principal, NIC, census no..." value="${searchQuery}" /></div>
  <div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr>
      <td>${r.censusNo}</td><td>${r.schoolName}</td><td>${r.division}</td><td>${r.principalName}</td>
      <td>${r.nic}</td><td>${r.dob}</td><td>${r.schoolType}</td><td>${r.appointmentType}</td>
      <td>${r.dateAppointed}</td><td>${r.phone}</td><td>${r.grade}</td><td>${r.qualification}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}


// ---------- Excel Export & Print ----------
function csvEscape(value){
  const text = String(value ?? "");
  return '"' + text.replace(/"/g, '""') + '"';
}

function downloadCSV(filename, rows){
  const csv = rows.map(row => row.map(csvEscape).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportRecordsToExcel(rows, filename){
  const headers = [
    "Census No","School","Division","Principal","NIC","DOB",
    "School Type","Appointment Type","Date Appointed","Phone",
    "Grade","Qualification"
  ];

  const data = rows.map(r => [
    r.censusNo, r.schoolName, r.division, r.principalName,
    r.nic, r.dob, r.schoolType, r.appointmentType,
    r.dateAppointed, r.phone, r.grade, r.qualification
  ]);

  downloadCSV(filename, [headers, ...data]);
}

// ---------- Content event wiring ----------
function attachContentEvents(){
  if(currentTab==="manage"){
    document.querySelectorAll("[data-edit]").forEach(b=>{
      b.onclick = ()=> openForm(parseInt(b.dataset.edit));
    });
    document.querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = ()=>{
        if(confirm("Delete this principal record?")){
          records = records.filter(r=>r.id!==parseInt(b.dataset.del));
          render();
        }
      };
    });
  }
  if(currentTab==="report"){
    const printBtn = document.getElementById("printReportBtn");
    const exportBtn = document.getElementById("exportReportBtn");

    if(printBtn) printBtn.onclick = printReport;
    if(exportBtn) exportBtn.onclick = () => {
      exportRecordsToExcel(filteredReport(), "principal_report.csv");
    };

    document.querySelectorAll("[data-filter]").forEach(sel=>{
      sel.onchange = ()=>{
        filters[sel.dataset.filter] = sel.value;
        render();
      };
    });
  }
  if(currentTab==="database"){
    const exportBtn = document.getElementById("exportDatabaseBtn");
    if(exportBtn) exportBtn.onclick = () => {
      exportRecordsToExcel(filteredDb(), "principal_database.csv");
    };

    const input = document.getElementById("searchInput");

      render();

      document.getElementById("searchInput").setSelectionRange(searchQuery.length, searchQuery.length);
    };
  }
}

// ---------- Form modal ----------
const overlay = document.getElementById("overlay");
const formGrid = document.getElementById("formGrid");
const formCard = document.getElementById("formCard");
const formTitle = document.getElementById("formTitle");

function emptyForm(){
  const f = {id:null};
  FIELD_DEFS.forEach(d=> f[d.key] = d.type==="select" ? d.opts[0] : "");
  return f;
}
let formData = emptyForm();

function buildFormFields(){
  formGrid.innerHTML = "";
  FIELD_DEFS.forEach(d=>{
    const wrap = document.createElement("label");
    wrap.className = "field" + (d.span2 ? " span2" : "");
    let inputHtml = "";
    if(d.type==="select"){
      inputHtml = `<select data-key="${d.key}">${d.opts.map(o=>`<option ${formData[d.key]===o?"selected":""}>${o}</option>`).join("")}</select>`;
    } else if(d.type==="date"){
      inputHtml = `<input type="date" data-key="${d.key}" value="${formData[d.key]||""}" />`;
    } else {
      inputHtml = `<input type="text" data-key="${d.key}" value="${(formData[d.key]||"").replace(/"/g,'&quot;')}" ${d.required?"required":""} />`;
    }
    wrap.innerHTML = `<span><b>${d.num}.</b>${d.label}</span>${inputHtml}`;
    formGrid.appendChild(wrap);
  });
}

function openForm(id){
  if(id){
    editingId = id;
    formData = {...records.find(r=>r.id===id)};
    formTitle.textContent = "Edit Principal Record";
  } else {
    editingId = null;
    formData = emptyForm();
    formTitle.textContent = "Add Principal Record";
  }
  buildFormFields();
  // Show the form inside the current Principal Data page instead of a pop-up.
  const content = document.getElementById("content");
  content.prepend(overlay);
  overlay.classList.add("show");
  overlay.scrollIntoView({behavior:"smooth", block:"start"});
}
function closeForm(){ overlay.classList.remove("show"); }

document.getElementById("addBtn").onclick = ()=> openForm(null);
document.getElementById("closeForm").onclick = closeForm;
document.getElementById("cancelBtn").onclick = closeForm;
overlay.onclick = (e)=>{ if(e.target===overlay) closeForm(); };

formCard.onsubmit = (e)=>{
  e.preventDefault();
  formGrid.querySelectorAll("[data-key]").forEach(el=>{
    formData[el.dataset.key] = el.value;
  });
  if(!formData.schoolName || !formData.principalName){ return; }
  if(editingId){
    records = records.map(r=> r.id===editingId ? {...formData, id:editingId} : r);
  } else {
    records.push({...formData, id: Date.now()});
  }
  closeForm();
  render();
};


// ---------- Admin Login ----------
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123";

const loginScreen = document.getElementById("loginScreen");
const loginForm = document.getElementById("loginCard");
const loginError = document.getElementById("loginError");
const logoutBtn = document.getElementById("logoutBtn");

function showApp(){
  loginScreen.style.display = "none";
  document.getElementById("app").style.display = "flex";
}

function showLogin(){
  loginScreen.style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("loginUsername").value = "";
  document.getElementById("loginPassword").value = "";
  loginError.textContent = "";
}

loginForm.onsubmit = (e)=>{
  e.preventDefault();
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;

  if(username === ADMIN_USERNAME && password === ADMIN_PASSWORD){
    sessionStorage.setItem("adminLoggedIn", "true");
    showApp();
  } else {
    loginError.textContent = "Invalid username or password.";
  }
};

logoutBtn.onclick = ()=>{
  sessionStorage.removeItem("adminLoggedIn");
  showLogin();
};

if(sessionStorage.getItem("adminLoggedIn") === "true"){
  showApp();
} else {
  showLogin();
}


// ---------- Init ----------
render();
